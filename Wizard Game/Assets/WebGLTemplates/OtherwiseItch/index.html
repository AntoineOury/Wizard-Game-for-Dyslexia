<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Touch-first: no pinch zoom, no double-tap zoom, fill the notch area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141422; }
      #unity-container { position: absolute; inset: 0; }
      /* touch-action none: the browser never steals a drag for scrolling —
         joystick, look surface and letter tracing all need every finger move. */
      #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; background: #141422; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; color: #f0ead8;
                 font-family: "Segoe UI", system-ui, sans-serif; }
      #loading div:first-child { font-size: 20px; letter-spacing: 0.5px; }
      #progress { width: 60%; max-width: 420px; height: 14px; background: #2b2b40;
                  border-radius: 7px; overflow: hidden; margin-top: 14px; }
      #progress-fill { width: 0%; height: 100%; background: #5b8def; transition: width 0.15s; }
      #rotate-hint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
                     background: #141422; color: #f0ead8; font-family: system-ui, sans-serif;
                     font-size: 22px; text-align: center; z-index: 10; }
      @media (orientation: portrait) { #rotate-hint { display: flex; } }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="1"></canvas>
      <div id="loading">
        <div>Loading the Wizard world...</div>
        <div id="progress"><div id="progress-fill"></div></div>
      </div>
      <div id="rotate-hint">Please turn your device sideways &#x21BB;</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Keep the page from scrolling/bouncing under a dragging finger.
      canvas.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });
      canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

      // Keyboard (B/T/Q/E) needs canvas focus inside the itch.io iframe, and a
      // first gesture is also the moment browsers allow an orientation lock.
      function grabFocus() {
        canvas.focus();
        if (screen.orientation && screen.orientation.lock)
          screen.orientation.lock("landscape").catch(function () {});
      }
      canvas.addEventListener("pointerdown", grabFocus);
      window.addEventListener("load", function () { canvas.focus(); });

      createUnityInstance(canvas, {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // The default template shows a "mobile browsers may not work" banner;
        // this game is built FOR touch, so log instead of scaring players.
        showBanner: function (msg, type) { console.log("[Unity " + (type || "log") + "] " + msg); },
        matchWebGLToCanvasSize: true,
        // Cap the render resolution on high-DPI phones: full 3x DPI is the
        // main thing that melts tablets in browser play.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      }, function (progress) {
        document.getElementById("progress-fill").style.width = (100 * progress) + "%";
      }).then(function (instance) {
        document.getElementById("loading").style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
